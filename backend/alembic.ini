# Alembic configuration for the FlameScope scientific database.
# Run from the backend/ directory:
#   alembic upgrade head            (uses FLAMESCOPE_DATABASE_URL)
#   alembic upgrade head --sql      (offline: prints PostgreSQL DDL, used for database/schema.sql)
[alembic]
script_location = %(here)s/app/data_platform/migrations
prepend_sys_path = .
# 'os' = split paths on os.pathsep only (the repo may live under a path that contains spaces)
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# sqlalchemy.url is intentionally empty: it comes from FLAMESCOPE_DATABASE_URL (see migrations/env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
